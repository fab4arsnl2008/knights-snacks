<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Prevent browser caching so schedule updates show immediately without refresh -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WYSA Knights Snack Schedule</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <!-- Google Fonts for Material Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Material Design 3 Motion Tokens & Custom Styles */
        :root {
            --m3-easing-emphasized: cubic-bezier(0.2, 0.0, 0, 1.0);
            --m3-easing-emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1.0);
            --m3-easing-emphasized-accel: cubic-bezier(0.3, 0.0, 0.8, 0.15);
            --m3-easing-standard: cubic-bezier(0.2, 0.0, 0, 1.0);
            --m3-easing-standard-decel: cubic-bezier(0.0, 0.0, 0.2, 1.0);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Card entrance stagger */
        @keyframes m3CardEnter {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Modal desktop entrance & exit */
        @keyframes m3ModalIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes m3ModalOut {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
        }

        /* Mobile bottom sheet entrance & exit */
        @keyframes m3SheetIn {
            0% {
                transform: translateY(100%);
            }
            100% {
                transform: translateY(0);
            }
        }

        @keyframes m3SheetOut {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100%);
            }
        }

        /* Backdrop fade */
        @keyframes m3BackdropIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes m3BackdropOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Modal sub-view smooth cross-fade */
        @keyframes m3ViewIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toast notifications */
        @keyframes m3ToastIn {
            0% {
                opacity: 0;
                transform: translateY(28px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes m3ToastOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
        }

        /* Checkmark icon pop */
        @keyframes m3CheckPop {
            0% {
                transform: scale(0.4);
                opacity: 0;
            }
            60% {
                transform: scale(1.18);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Ripple halo */
        @keyframes m3PulseRing {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        /* Progress shimmer */
        @keyframes m3Shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Gentle floating badge */
        @keyframes m3Float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .m3-card-enter {
            animation: m3CardEnter 400ms var(--m3-easing-emphasized-decel) forwards;
        }

        .m3-modal-in {
            animation: m3ModalIn 320ms var(--m3-easing-emphasized-decel) forwards;
        }

        .m3-modal-out {
            animation: m3ModalOut 220ms var(--m3-easing-emphasized-accel) forwards;
        }

        @media (max-width: 639px) {
            .m3-modal-in {
                animation: m3SheetIn 340ms var(--m3-easing-emphasized-decel) forwards;
            }
            .m3-modal-out {
                animation: m3SheetOut 240ms var(--m3-easing-emphasized-accel) forwards;
            }
        }

        .m3-backdrop-in {
            animation: m3BackdropIn 280ms ease-out forwards;
        }

        .m3-backdrop-out {
            animation: m3BackdropOut 220ms ease-in forwards;
        }

        .m3-view-enter {
            animation: m3ViewIn 260ms var(--m3-easing-standard-decel) forwards;
        }

        .m3-toast-in {
            animation: m3ToastIn 300ms var(--m3-easing-emphasized-decel) forwards;
        }

        .m3-toast-out {
            animation: m3ToastOut 220ms var(--m3-easing-emphasized-accel) forwards;
        }

        .m3-check-pop {
            animation: m3CheckPop 450ms var(--m3-easing-emphasized-decel) forwards;
        }

        .m3-pulse-ring {
            animation: m3PulseRing 1200ms ease-out infinite;
        }

        .m3-floating-badge {
            animation: m3Float 3s ease-in-out infinite;
        }

        /* M3 state layer ripple effect on buttons */
        .m3-state-layer {
            position: relative;
            overflow: hidden;
            transition: all 200ms var(--m3-easing-standard);
        }

        .m3-state-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 150ms ease;
            pointer-events: none;
            border-radius: inherit;
        }

        .m3-state-layer:hover::after {
            opacity: 0.08;
        }

        .m3-state-layer:active::after {
            opacity: 0.16;
        }

        /* Smooth scroll styling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-[#F9FAFB]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDNVA6hBnk1F-TD_pheKUOLE6dwuiYfpZ4",
            authDomain: "knights-snacks.firebaseapp.com",
            projectId: "knights-snacks",
            storageBucket: "knights-snacks.firebasestorage.app",
            messagingSenderId: "680090441956",
            appId: "1:680090441956:web:17d34365668fb494a434f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- ICONS (Inline to prevent crashes) ---
        const IconBase = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{children}</svg>
        );
        const Calendar = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6" /></IconBase>;
        const AlertTriangle = (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" x2="12" y1="9" y2="13" /><line x1="12" x2="12.01" y1="17" y2="17" /></IconBase>;
        const Cookie = (props) => <IconBase {...props}><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5" /><path d="M8.5 8.5v.01" /><path d="M16 15.5v.01" /><path d="M12 12v.01" /><path d="M11 17v.01" /><path d="M7 14v.01" /></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></IconBase>;
        const ExternalLink = (props) => <IconBase {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" x2="21" y1="14" y2="3" /></IconBase>;

        // --- CONSTANTS ---
        const COLORS = {
            navy: '#15284B',
            steel: '#3C6EAB',
            white: '#FFFFFF',
            silver: '#A8B3BD',
            black: '#0D1115',
        };

        const SCHEDULE_DATES = [
            { id: 'feb-28', display: 'Saturday, Feb 28 @1:10pm', short: 'Feb 28', start: '20260228T131000', end: '20260228T141000' },
            { id: 'mar-28', display: 'Saturday, Mar 28 @11:15am', short: 'Mar 28', start: '20260328T111500', end: '20260328T121500' },
            { id: 'apr-09', display: 'Thursday, Apr 9 @6:00pm', short: 'Apr 9', start: '20260409T180000', end: '20260409T190000' },
            { id: 'apr-11', display: 'Saturday, Apr 11 @1:00pm', short: 'Apr 11', start: '20260411T130000', end: '20260411T140000' },
            { id: 'apr-20', display: 'Monday, Apr 20 @6:00pm', short: 'Apr 20', start: '20260420T180000', end: '20260420T190000' },
            { id: 'may-02', display: 'Saturday, May 2 @11:35am', short: 'May 2', start: '20260502T113500', end: '20260502T123500' },
            { id: 'may-09', display: 'Saturday, May 9 @1:55pm', short: 'May 9', start: '20260509T135500', end: '20260509T145500' },
            { id: 'may-11', display: 'Monday, May 11 @6:00pm', short: 'May 11', start: '20260511T180000', end: '20260511T190000' },
        ];

        const appId = 'wylie-knights-2026';

        // --- CALENDAR EXPORT HELPERS ---
        const getGoogleCalendarUrl = (selectedDate, parentName, childName) => {
            if (!selectedDate) return '#';
            const title = 'Bring Snacks - WYSA Knights ⚽🧃';
            const location = 'WYSA Soccer Fields';
            const childText = childName ? ` for ${childName}'s team` : '';
            const details = `Reminder: Snack duty${childText}!\n\nParent: ${parentName || 'Parent'}\nPlayer: ${childName || 'Player'}\nMatch: ${selectedDate.display}\n\nRemember to bring snacks for the team today! Go Knights! ⚽🧃`;

            const dates = `${selectedDate.start}/${selectedDate.end}`;

            const params = new URLSearchParams({
                action: 'TEMPLATE',
                text: title,
                dates: dates,
                details: details,
                location: location,
                ctz: 'America/Chicago',
                add: 'reminder:1440,120'  // 1440 min = 1 day, 120 min = 2 hours
            });

            return `https://calendar.google.com/calendar/render?${params.toString()}`;
        };

        const downloadIcsFile = (selectedDate, parentName, childName) => {
            if (!selectedDate) return;
            const title = 'Bring Snacks - WYSA Knights ⚽🧃';
            const location = 'WYSA Soccer Fields';
            const childText = childName ? ` for ${childName}'s team` : '';
            const description = `Reminder: Snack duty${childText}!\\n\\nParent: ${parentName || 'Parent'}\\nPlayer: ${childName || 'Player'}\\nMatch: ${selectedDate.display}\\n\\nRemember to bring snacks for the team today! Go Knights! ⚽🧃`;

            const nowUtc = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const uid = `wysa-knights-snack-${selectedDate.id}-${Date.now()}@wysaknights.org`;

            const icsLines = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//WYSA Knights//Snack Schedule//EN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                'BEGIN:VEVENT',
                `UID:${uid}`,
                `DTSTAMP:${nowUtc}`,
                `DTSTART;TZID=America/Chicago:${selectedDate.start}`,
                `DTEND;TZID=America/Chicago:${selectedDate.end}`,
                `SUMMARY:${title}`,
                `DESCRIPTION:${description}`,
                `LOCATION:${location}`,
                'STATUS:CONFIRMED',
                'BEGIN:VALARM',
                'ACTION:DISPLAY',
                'DESCRIPTION:Snack Duty Reminder - WYSA Knights (Tomorrow)',
                'TRIGGER:-P1D',
                'END:VALARM',
                'BEGIN:VALARM',
                'ACTION:DISPLAY',
                'DESCRIPTION:Snack Duty Reminder - WYSA Knights (2 Hours Prior)',
                'TRIGGER:-PT2H',
                'END:VALARM',
                'END:VEVENT',
                'END:VCALENDAR'
            ];

            const icsContent = icsLines.join('\r\n');
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `knights-snack-${selectedDate.id}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(link.href);
        };

        // --- MAIN COMPONENT ---
        const KnightsCalendar = () => {
            const [user, setUser] = React.useState(null);
            const [signups, setSignups] = React.useState({});
            const [loading, setLoading] = React.useState(true);
            const [selectedDate, setSelectedDate] = React.useState(null);
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [isModalClosing, setIsModalClosing] = React.useState(false);
            const [formData, setFormData] = React.useState({ parentName: '', childName: '' });
            const [viewMode, setViewMode] = React.useState('list'); // 'list', 'signup', 'manage', 'delete_confirm', 'success'
            const [icsDownloaded, setIcsDownloaded] = React.useState(false);
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            
            // Toast / Snackbar state
            const [toast, setToast] = React.useState(null); // { id, message, type, isExiting }
            const toastTimeoutRef = React.useRef(null);

            const showToast = (message, type = 'success') => {
                if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
                setToast({ id: Date.now(), message, type, isExiting: false });
                
                toastTimeoutRef.current = setTimeout(() => {
                    setToast(prev => prev ? { ...prev, isExiting: true } : null);
                    setTimeout(() => setToast(null), 250);
                }, 3500);
            };

            const dismissToast = () => {
                if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
                setToast(prev => prev ? { ...prev, isExiting: true } : null);
                setTimeout(() => setToast(null), 250);
            };

            // Auth
            React.useEffect(() => {
                signInAnonymously(auth);
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                });
                return () => unsubscribe();
            }, []);

            // Data Sync
            React.useEffect(() => {
                if (!user) return;
                const unsubscribe = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'snack_signups'),
                    (snapshot) => {
                        const data = {};
                        snapshot.forEach(doc => {
                            data[doc.id] = doc.data();
                        });
                        setSignups(data);
                        setLoading(false);
                    },
                    (error) => {
                        console.error("Error fetching signups:", error);
                        setLoading(false);
                    }
                );
                return () => unsubscribe();
            }, [user]);

            // Handlers
            const handleDateClick = (dateObj) => {
                const existingSignup = signups[dateObj.id];
                setSelectedDate(dateObj);
                setIcsDownloaded(false);
                setIsModalClosing(false);
                
                if (existingSignup) {
                    setFormData({
                        parentName: existingSignup.parentName,
                        childName: existingSignup.childName || '' // Handle legacy records
                    });
                    setViewMode('manage');
                } else {
                    setFormData({ parentName: '', childName: '' });
                    setViewMode('signup');
                }
                setIsModalOpen(true);
            };

            const handleInputChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedDate || !user || isSubmitting) return;
                setIsSubmitting(true);
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'snack_signups', selectedDate.id), {
                        parentName: formData.parentName.trim(),
                        childName: formData.childName.trim(),
                        dateId: selectedDate.id,
                        dateDisplay: selectedDate.display,
                        timestamp: serverTimestamp(),
                        userId: user.uid
                    });
                    setIsSubmitting(false);
                    setViewMode('success');
                    showToast(`🎉 You're signed up for ${selectedDate.short}!`, 'success');
                } catch (err) {
                    console.error("Error saving signup:", err);
                    setIsSubmitting(false);
                    showToast("Error saving. Please check connection.", "error");
                }
            };

            const confirmDelete = async () => {
                if (!selectedDate || !user || isSubmitting) return;
                setIsSubmitting(true);
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'snack_signups', selectedDate.id));
                    const freedDate = selectedDate.short;
                    setIsSubmitting(false);
                    closeModal();
                    showToast(`Slot released for ${freedDate}. Open for others.`, 'info');
                } catch (err) {
                    console.error("Error removing signup:", err);
                    setIsSubmitting(false);
                    showToast("Error removing slot. Please retry.", "error");
                }
            };

            const closeModal = () => {
                setIsModalClosing(true);
                setTimeout(() => {
                    setIsModalOpen(false);
                    setIsModalClosing(false);
                    setSelectedDate(null);
                    setFormData({ parentName: '', childName: '' });
                    setIcsDownloaded(false);
                    setIsSubmitting(false);
                }, 240);
            };

            const initiateCancel = () => setViewMode('delete_confirm');

            const handleDownloadIcs = () => {
                downloadIcsFile(selectedDate, formData.parentName, formData.childName);
                setIcsDownloaded(true);
                showToast("📅 Calendar invite (.ics) downloaded!", "info");
                setTimeout(() => setIcsDownloaded(false), 3500);
            };

            // --- SUB-COMPONENTS ---
            const Header = () => (
                <div className="w-full text-white shadow-md relative overflow-hidden" style={{ backgroundColor: COLORS.navy }}>
                    {/* Background decorative circles with subtle float */}
                    <div className="absolute top-0 right-0 w-44 h-44 bg-white/5 rounded-full blur-2xl transform translate-x-12 -translate-y-12 pointer-events-none"></div>
                    <div className="absolute bottom-0 left-1/3 w-32 h-32 bg-blue-400/10 rounded-full blur-xl pointer-events-none"></div>
                    
                    <div className="max-w-md mx-auto px-4 py-5 flex items-center justify-between relative z-10">
                        <div className="flex items-center space-x-3.5">
                            <div className="bg-white p-1 rounded-2xl shadow-sm w-14 h-14 flex items-center justify-center shrink-0 transition-transform duration-300 hover:scale-105">
                                <img
                                    src="https://raw.githubusercontent.com/fab4arsnl2008/vividmemories/refs/heads/main/images/Knights_Logo.png"
                                    alt="Knights Logo"
                                    className="w-12 h-12 object-contain"
                                />
                            </div>
                            <div>
                                <div className="flex items-center space-x-2">
                                    <h1 className="text-xl font-bold tracking-tight">WYSA Knights</h1>
                                    <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-white/15 text-blue-100 backdrop-blur-sm">Fall 2026</span>
                                </div>
                                <p className="text-xs font-medium opacity-85 mt-0.5" style={{ color: COLORS.silver }}>Official Team Snack Schedule</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-1.5 bg-white/10 px-2.5 py-1.5 rounded-full text-xs font-medium backdrop-blur-md border border-white/10">
                            <Cookie className="w-3.5 h-3.5 text-amber-300" />
                            <span>Snacks</span>
                        </div>
                    </div>
                </div>
            );

            const ProgressBar = () => {
                const total = SCHEDULE_DATES.length;
                const filled = Object.keys(signups).length;
                const percentage = Math.round((filled / total) * 100);
                const isAllFilled = filled === total;

                return (
                    <div className="bg-white px-5 py-4 mb-5 shadow-sm border-b border-gray-100 rounded-b-2xl">
                        <div className="flex justify-between items-center text-xs font-semibold mb-2.5" style={{ color: COLORS.navy }}>
                            <div className="flex items-center space-x-1.5">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span className="uppercase tracking-wider text-[11px] text-gray-500 font-bold">Season Coverage</span>
                            </div>
                            <div className="flex items-center space-x-2">
                                <span className="font-bold text-gray-800">{filled} / {total} Matches</span>
                                <span className={`text-[11px] px-2 py-0.5 rounded-full font-bold transition-all duration-300 ${isAllFilled ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-50 text-blue-700'}`}>
                                    {percentage}%
                                </span>
                            </div>
                        </div>

                                                    className="m3-state-layer w-full py-3 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200/80 transition-all text-xs active:scale-[0.98]"
                                                >
                                                    Go Back
                                                </button>
                                                <button
                                                    type="button"
                                                    disabled={isSubmitting}
                                                    onClick={confirmDelete}
                                                    className="m3-state-layer w-full py-3 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 shadow-md transition-all text-xs active:scale-[0.98] disabled:opacity-60 flex items-center justify-center space-x-1.5"
                                                >
                                                    {isSubmitting ? (
                                                        <>
                                                            <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                                            <span>Releasing...</span>
                                                        </>
                                                    ) : (
                                                        <span>Yes, Release Slot</span>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer with Logo */}
                    <div className="flex flex-col items-center justify-center mt-12 mb-6 space-y-2 opacity-80 hover:opacity-100 transition-opacity">
                        <img
                            src="https://raw.githubusercontent.com/fab4arsnl2008/vividmemories/refs/heads/main/images/Knights_Logo.png"
                            alt="Knights Logo"
                            className="w-12 h-12 object-contain"
                        />
                        <span className="text-[11px] text-slate-400 font-medium">WYSA Knights • Snack Signup</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KnightsCalendar />);
    </script>
</body>

</html>
